spring:
  application:
    name: miaoji-backend
  config:
    import: optional:file:./.env.local.properties
  datasource:
    url: ${MIAOJI_DB_URL}
    username: ${MIAOJI_DB_USERNAME}
    password: ${MIAOJI_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
miaoji:
  storage-root: ${MIAOJI_STORAGE_DIR:./storage}
server:
  address: 127.0.0.1
  port: ${MIAOJI_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: MIAOJI_SESSION
        http-only: true
        same-site: lax
        secure: ${MIAOJI_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
